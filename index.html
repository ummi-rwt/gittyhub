<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio · Mes projets Data & IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3efe8; --ink:#1d1a2e; --muted:#5d5a70; --wall:#e4ded2; --light:#ffd9a0; --room:#fff3dc;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15132b;--ink:#f4efe6;--muted:#a9a6c2;--wall:#1f1c3d;--light:#ffbf69;--room:#3a2f2a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#15132b;--ink:#f4efe6;--muted:#a9a6c2;--wall:#1f1c3d;--light:#ffbf69;--room:#3a2f2a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100vh}
header{max-width:760px;margin:0 auto;padding:56px 24px 24px}
h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:1.1rem;line-height:1.5;max-width:52ch}
main{max-width:1000px;margin:0 auto;padding:24px 24px 72px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:40px 28px}
.door{display:block;text-decoration:none;color:inherit;perspective:900px}
.frame{position:relative;aspect-ratio:3/4.6;border-radius:999px 999px 6px 6px;background:var(--wall);padding:10px;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent)}
.room{position:absolute;inset:10px;border-radius:999px 999px 2px 2px;background:radial-gradient(ellipse at 50% 85%,var(--light),var(--room) 70%);display:flex;flex-direction:column;justify-content:flex-end;padding:18px 14px;text-align:center;color:#2a2118}
.room b{font-size:1.05rem;line-height:1.2}
.room span{font-size:.85rem;margin-top:6px;opacity:.8}
.panel{position:absolute;inset:10px;border-radius:999px 999px 2px 2px;background:var(--c);transform-origin:left center;transition:transform .7s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:0 12px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.18)}
.panel .ico{font-size:2.6rem}
.panel .t{font-weight:800;font-size:1.15rem;line-height:1.15}
.panel i{position:absolute;right:16px;top:58%;width:12px;height:12px;border-radius:50%;background:#ffe9b8}
.door:hover .panel,.door:focus-visible .panel{transform:rotateY(-72deg)}
.door:focus-visible{outline:3px solid var(--ink);outline-offset:6px;border-radius:12px}
.soon{display:inline-block;margin-top:8px;font-size:.75rem;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.14)}
.hint{text-align:center;color:var(--muted);padding:0 24px 40px;font-size:.95rem}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}

/* ============================================================
   🚪 THÈMES DE PORTES
   Chaque thème = une classe .t-xxx ici + une entrée dans "themes" plus bas.
   Les portes sans "theme" gardent le style de base ci-dessus.
   ============================================================ */

/* 🪷 Thème INDIEN : arche mogole, double battant sculpté, laiton */
.t-indien{filter:drop-shadow(0 10px 14px rgba(60,20,10,.28))}
.t-indien .frame{
  border-radius:0; padding:0; box-shadow:none; perspective:900px;
  background:linear-gradient(145deg,#f0c75a,#b9812a 55%,#e3b04a);
  clip-path:url(#arche-indienne);
}
.t-indien .room,
.t-indien .panel{
  inset:12px; border-radius:0; box-shadow:none;
  clip-path:url(#arche-indienne);
}
.t-indien .room{
  background:
    radial-gradient(circle at 50% 30%,rgba(255,255,255,.35),transparent 45%),
    radial-gradient(ellipse at 50% 85%,var(--light),var(--room) 70%);
}
.t-indien .panel{
  background:
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.14),transparent 60%),
    linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,0) 40%,rgba(0,0,0,.2)),
    var(--c);
}
.t-indien .panel .decor{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.t-indien .panel .ico,
.t-indien .panel .t{position:relative;z-index:1;text-shadow:0 2px 6px rgba(0,0,0,.45)}
.t-indien .panel .ico{margin-top:-12px}
</style>
</head>
<body>

<!-- Formes réutilisables (invisible) : l'arche indienne, en pourcentages de la porte -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="arche-indienne" clipPathUnits="objectBoundingBox">
      <path d="M0,1 V0.43 C0,0.30 0.30,0.24 0.41,0.145 C0.46,0.10 0.48,0.05 0.5,0 C0.52,0.05 0.54,0.10 0.59,0.145 C0.70,0.24 1,0.30 1,0.43 V1 Z"/>
    </clipPath>
  </defs>
</svg>

<header>
  <h1>Open the doors...</h1>
  <p>Welcome to <b>Umang's</b> portfolio. Each door opens to a different data or IA driven project including the tools used, the datas and what I've learned from it ! </p>
</header>
<main id="doors"></main>
<p class="hint">Open any door to unlock the project.</p>

<script>
// ✏️ C’EST ICI QUE TU MODIFIES TES PROJETS.
// Pour ajouter une porte : copie une ligne et change les textes.
// Quand un projet est prêt : mets son lien dans "lien" et "pret: true".
// Pour donner un décor spécial à une porte : ajoute  theme:"indien"  (voir "themes" plus bas).
const projets = [
  { titre:"Dashboard data",       icone:"🪷", couleur:"#8b2635", outil:"Visualisation · Streamlit",   lien:"", pret:false, theme:"indien" },
  { titre:"Projet IA",            icone:"🧠", couleur:"#7b4fd6", outil:"Machine learning",            lien:"", pret:false },
  { titre:"Chatbot",              icone:"💬", couleur:"#d9467a", outil:"LLM · API",                   lien:"", pret:false },
  { titre:"Marketing, IA & Data", icone:"🎯", couleur:"#e07a1f", outil:"Segmentation · BI",           lien:"", pret:false },
  { titre:"Senteurs",             icone:"🌸", couleur:"#2e9d8a", outil:"Dataset · Clustering",        lien:"", pret:false },
  { titre:"Air & trafic",         icone:"🌍", couleur:"#4b8f3a", outil:"Données publiques · Cartes",  lien:"", pret:false }
];

// 🎨 THÈMES : "classe" = la classe CSS du thème, "decor" = le dessin SVG ajouté sur le battant.
// Pour créer un nouveau thème (ex. japonais, égyptien…) : ajoute une entrée ici
// + les règles CSS .t-japonais dans la balise <style>.
const themes = {
  indien: {
    classe: "t-indien",
    decor: `
<svg class="decor" viewBox="0 0 300 460" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Double liseré doré qui suit l'arche -->
  <g fill="none" stroke="#f2c14e" stroke-linecap="round">
    <path d="M14,460 V204 C14,150 100,124 134,82 C144,68 148,50 150,30 C152,50 156,68 166,82 C200,124 286,150 286,204 V460" stroke-width="3"/>
    <path d="M26,460 V208 C26,158 108,134 140,94 C146,86 149,70 150,56 C151,70 154,86 160,94 C192,134 274,158 274,208 V460" stroke-width="1.5" opacity=".7"/>
  </g>

  <!-- Fleur de lotus / mandala au sommet -->
  <g transform="translate(150,116) scale(.8)" fill="#f2c14e">
    <ellipse cx="0" cy="-13" rx="4.5" ry="11"/>
    <ellipse cx="0" cy="-13" rx="4.5" ry="11" transform="rotate(45)"/>
    <ellipse cx="0" cy="-13" rx="4.5" ry="11" transform="rotate(90)"/>
    <ellipse cx="0" cy="-13" rx="4.5" ry="11" transform="rotate(135)"/>
    <ellipse cx="0" cy="-13" rx="4.5" ry="11" transform="rotate(180)"/>
    <ellipse cx="0" cy="-13" rx="4.5" ry="11" transform="rotate(225)"/>
    <ellipse cx="0" cy="-13" rx="4.5" ry="11" transform="rotate(270)"/>
    <ellipse cx="0" cy="-13" rx="4.5" ry="11" transform="rotate(315)"/>
    <circle r="5.5" fill="#8b2635" stroke="#f2c14e" stroke-width="2"/>
  </g>

  <!-- Frise de losanges (jali) -->
  <g fill="none" stroke="#f2c14e" stroke-width="1.6" opacity=".9">
    <path d="M70,152 l8,-8 l8,8 l-8,8 z M96,152 l8,-8 l8,8 l-8,8 z M122,152 l8,-8 l8,8 l-8,8 z M148,152 l8,-8 l8,8 l-8,8 z M174,152 l8,-8 l8,8 l-8,8 z M200,152 l8,-8 l8,8 l-8,8 z"/>
  </g>

  <!-- Jonction des deux battants -->
  <path d="M150,316 V460" stroke="rgba(0,0,0,.45)" stroke-width="4"/>
  <path d="M146,316 V460 M154,316 V460" stroke="#f2c14e" stroke-width="1" opacity=".6"/>

  <!-- Panneaux sculptés du bas -->
  <g fill="rgba(0,0,0,.18)" stroke="#f2c14e" stroke-width="2">
    <rect x="38" y="334" width="96" height="104" rx="6"/>
    <rect x="166" y="334" width="96" height="104" rx="6"/>
  </g>
  <g fill="none" stroke="#f2c14e" stroke-width="2">
    <path d="M86,356 L108,386 L86,416 L64,386 Z"/>
    <path d="M214,356 L236,386 L214,416 L192,386 Z"/>
  </g>
  <g fill="#f2c14e">
    <circle cx="86" cy="386" r="6"/><circle cx="214" cy="386" r="6"/>
    <!-- clous en laiton -->
    <circle cx="50" cy="346" r="3.5"/><circle cx="122" cy="346" r="3.5"/>
    <circle cx="50" cy="426" r="3.5"/><circle cx="122" cy="426" r="3.5"/>
    <circle cx="178" cy="346" r="3.5"/><circle cx="250" cy="346" r="3.5"/>
    <circle cx="178" cy="426" r="3.5"/><circle cx="250" cy="426" r="3.5"/>
  </g>

  <!-- Poignées en anneau -->
  <g fill="none" stroke="#ffe9b8" stroke-width="3">
    <circle cx="137" cy="300" r="7"/><circle cx="163" cy="300" r="7"/>
  </g>
</svg>`
  }
};

const conteneur = document.getElementById("doors");
projets.forEach(p => {
  const th = themes[p.theme];            // undefined si la porte n'a pas de thème
  const a = document.createElement("a");
  a.className = "door" + (th ? " " + th.classe : "");
  a.href = p.pret ? p.lien : "#";
  if (p.pret) { a.target = "_blank"; a.rel = "noopener"; }
  else { a.addEventListener("click", e => e.preventDefault()); }
  a.setAttribute("aria-label", p.titre + (p.pret ? "" : " (bientôt disponible)"));
  a.innerHTML =
    '<div class="frame">' +
      '<div class="room"><b>' + p.titre + '</b><span>' + p.outil + '</span>' +
        (p.pret ? '' : '<span class="soon">Bientôt disponible</span>') + '</div>' +
      '<div class="panel" style="--c:' + p.couleur + '">' + (th ? th.decor : '') +
        '<span class="ico">' + p.icone + '</span>' +
        '<span class="t">' + p.titre + '</span>' + (th ? '' : '<i></i>') + '</div>' +
    '</div>';
  conteneur.appendChild(a);
});
</script>
</body>
</html>
